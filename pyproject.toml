[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulse-monitor"
# Read from src/pulse/__init__.py so the two can never drift apart again.
dynamic = ["version"]
description = "A cinematic terminal-based system monitor"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Fatin Ishraq", email = "dev@pulse-monitor.io" },
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Monitoring",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
]
keywords = ["terminal", "tui", "system-monitor", "telemetry", "cinematic"]
dependencies = [
    "textual>=2.0.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
# Access to the Docker socket is root-equivalent on the host, so container
# monitoring is opt-in rather than pulled in by every install.
docker = [
    "docker>=6.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/Fatin-Ishraq/Pulse"
Repository = "https://github.com/Fatin-Ishraq/Pulse.git"
Issues = "https://github.com/Fatin-Ishraq/Pulse/issues"
Changelog = "https://github.com/Fatin-Ishraq/Pulse/blob/main/CHANGELOG.md"

[project.scripts]
pulse = "pulse.app:main"

[tool.hatch.version]
path = "src/pulse/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
